<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Palette Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Unbounded:wght@300;400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f3ec; --ink: #2e1a1a; --cream: #ede8dc; --cream2: #e2dccf;
  --gold: #f04400; --gold-light: #ff9070; --muted: #7a7060; --radius: 16px;
  --lavender: #b5c96a; --pink-star: #e8a0bf;
  --card-pad: 18px; --swatch-size: 52px; --card-font: 1.4rem; --cards-gap: 10px;
}
html, body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0.5;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  background-size: 128px;
}
.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 80px; position: relative; }

/* ── Header ── */
header { text-align: center; margin-bottom: 48px; width: 100%; max-width: 500px; }
.series-tag { display: inline-block; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--cream2); border-radius: 99px; padding: 5px 16px; margin-bottom: 20px; }
h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 700; line-height: 0.95; letter-spacing: -0.02em; margin-bottom: 18px; color: #00b5ad; }
h1 span { display: block; color: var(--lavender); font-style: italic; font-weight: 700; font-size: clamp(2.2rem, 7.5vw, 3.4rem); }
.tagline { font-size: 13px; color: var(--muted); line-height: 1.7; max-width: 320px; margin: 0 auto; }

/* ── 3D Die ── */
.dice-section {
  width: 100%; max-width: 500px;
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; margin-bottom: 6px;
  position: relative;
}

.dice-wrapper {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  cursor: pointer;
  transform: translateY(0);
  transition: transform 0.28s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.dice-wrapper:not(.rolling):hover { transform: translateY(-14px); }
.dice-wrapper:not(.rolling):hover .dice-shadow { transform: scaleX(0.7) scaleY(0.6); opacity: 0.5; }
.dice-wrapper.rolling { cursor: wait; }

.dice-scene {
  perspective: 360px;
  width: 76px; height: 76px;
}

.dice-cube {
  width: 76px; height: 76px;
  position: relative;
  transform-style: preserve-3d;
  /* Initial: classic 3-corner 3D view — face 1 front, face 3 top, face 2 right visible */
  transform: rotateX(-20deg) rotateY(30deg);
  transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}

.dice-face {
  position: absolute;
  width: 76px; height: 76px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.dice-face svg { width: 48px; height: 48px; display: block; }

/* Per-face lighting — light source top-left-front */
.face-1 { transform: translateZ(38px);
  background: linear-gradient(140deg, #ffffff 0%, #ede7dc 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.06),
              inset 2px 2px 7px rgba(255,255,255,0.65),
              inset -1px -1px 3px rgba(46,26,26,0.05); }
.face-6 { transform: rotateY(180deg)  translateZ(38px);
  background: linear-gradient(140deg, #cdc9be 0%, #bfbbb0 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.04); }
.face-2 { transform: rotateY(90deg)   translateZ(38px);
  background: linear-gradient(150deg, #d9d4c9 0%, #cdc8bc 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.05); }
.face-5 { transform: rotateY(-90deg)  translateZ(38px);
  background: linear-gradient(150deg, #e8e3d8 0%, #ddd8cc 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.05); }
.face-3 { transform: rotateX(-90deg)  translateZ(38px);
  background: linear-gradient(160deg, #f5f0e5 0%, #e8e2d6 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.06); }
.face-4 { transform: rotateX(90deg)   translateZ(38px);
  background: linear-gradient(140deg, #c8c3b7 0%, #bab5a9 100%);
  box-shadow: inset 0 0 0 1px rgba(46,26,26,0.04); }

.dice-shadow {
  width: 62px; height: 12px;
  background: radial-gradient(ellipse at center, rgba(46,26,26,0.22) 0%, transparent 68%);
  border-radius: 50%;
  margin-top: 2px;
  transition: transform 0.28s ease, opacity 0.28s ease;
}

.dice-result {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-style: italic; font-weight: 400;
  color: var(--ink);
  text-align: center;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
  min-height: 1.5em;
}
.dice-result.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

.dice-hint {
  font-family: 'Unbounded', sans-serif;
  font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  transition: opacity 0.35s ease;
}
.dice-hint.hidden { opacity: 0; pointer-events: none; }

/* ── Noir Toggle ── */
.die-anchor {
  position: relative; display: inline-flex;
}
.noir-toggle {
  display: flex; align-items: center; gap: 6px;
  position: absolute; top: -38px; left: calc(100% + 10px);
}
.noir-pastille {
  width: 9px; height: 9px; border-radius: 50%;
  background: #111; flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}
.toggle-switch {
  position: relative; display: inline-block;
  width: 26px; height: 14px; cursor: pointer;
}
.toggle-switch input { display: none; }
.toggle-track {
  position: absolute; inset: 0; border-radius: 14px;
  background: #ccc8c0;
  transition: background 0.22s;
}
.toggle-track::after {
  content: ''; position: absolute;
  top: 2px; left: 2px;
  width: 10px; height: 10px; border-radius: 50%;
  background: white;
  transition: transform 0.22s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.toggle-switch input:checked + .toggle-track { background: #34c759; }
.toggle-switch input:checked + .toggle-track::after { transform: translateX(12px); }

/* ── Color Cards ── */
.cards-area { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: var(--cards-gap); }
.color-swatch {
  flex: 1; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.38s ease, transform 0.38s ease;
  min-height: 52px;
}
.color-swatch.visible { opacity: 1; transform: translateY(0); }
.swatch-name {
  font-family: 'DM Sans', sans-serif;
  font-size: var(--card-font);
  font-weight: 300;
  letter-spacing: 0.08em;
  pointer-events: none; user-select: none;
}

/* ── Animations ── */
@keyframes sparkle-pop {
  0%   { opacity:0; transform: scale(0) rotate(0deg); }
  40%  { opacity:1; transform: scale(1.2) rotate(20deg); }
  70%  { opacity:0.8; transform: scale(1) rotate(-10deg); }
  100% { opacity:0; transform: scale(0.4) rotate(30deg) translateY(-12px); }
}

/* ── Deco ── */
.deco-num { position: absolute; font-family: 'Playfair Display', serif; font-size: 8rem; font-weight: 700; color: var(--cream2); line-height: 1; pointer-events: none; user-select: none; z-index: -1; }
.deco-left { left: -10px; top: 130px; }
.deco-right { right: -10px; bottom: 220px; opacity: 0.5; }

/* ── Mobile: everything fits on one screen ── */
@media (max-width: 600px) {
  html, body { height: 100dvh; overflow: hidden; }
  .page {
    min-height: unset; height: 100dvh;
    padding: 16px 14px 10px;
    justify-content: flex-start;
    overflow: hidden;
  }
  .deco-num { display: none; }

  header { margin-bottom: 52px; }
  h1 { font-size: clamp(1.4rem, 6.5vw, 2.2rem); margin-bottom: 4px; }
  h1 span { font-size: clamp(1.7rem, 8vw, 2.6rem); }
  .series-tag { font-size: 7.5px; padding: 3px 10px; margin-bottom: 8px; }
  .tagline { font-size: 10.5px; margin-top: 6px !important; }

  .dice-section { gap: 8px; margin-bottom: 0; }
  .dice-scene { perspective: 260px; width: 54px; height: 54px; }
  .dice-cube  { width: 54px; height: 54px; }
  .dice-face  { width: 54px; height: 54px; border-radius: 8px; }
  .dice-face svg { width: 34px; height: 34px; }
  .face-1 { transform: translateZ(27px); }
  .face-6 { transform: rotateY(180deg)  translateZ(27px); }
  .face-2 { transform: rotateY(90deg)   translateZ(27px); }
  .face-5 { transform: rotateY(-90deg)  translateZ(27px); }
  .face-3 { transform: rotateX(-90deg)  translateZ(27px); }
  .face-4 { transform: rotateX(90deg)   translateZ(27px); }
  .dice-shadow { width: 42px; }
  .dice-hint { font-size: 7px; }

  .cards-area { flex: 1; min-height: 0; overflow: hidden; }
  .color-swatch { min-height: 0; border-radius: 10px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="deco-num deco-left">6</div>
  <div class="deco-num deco-right">✦</div>

  <header>
    <div style="position:relative; display:block; width:fit-content; margin:0 auto; padding: 0 60px;">
      <h1>palette<span>roulette</span></h1>
      <svg style="position:absolute;top:-8px;right:4px;width:46px;height:46px;opacity:0.85;" viewBox="0 0 46 46" fill="none">

  </header>

  <div class="dice-section">
    <div class="die-anchor">
    <div class="dice-wrapper" id="dice-wrapper" onclick="roll()" tabindex="0" role="button" aria-label="Lancer le dé">
      <div class="dice-scene">
        <div class="dice-cube" id="dice-cube">

          <!-- Face 1 — front -->
          <div class="dice-face face-1">
            <svg viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="8.5" fill="#22110a"/>

            </svg>
          </div>

          <!-- Face 2 — right (rotateY 90) -->
          <div class="dice-face face-2">
            <svg viewBox="0 0 100 100" fill="none">
              <circle cx="30" cy="30" r="8.5" fill="#22110a"/>

              <circle cx="50" cy="50" r="8.5" fill="#22110a"/>
              <circle cx="47" cy="46" r="3" fill="rgba(255,255,255,0.22)"/>
              <circle cx="70" cy="70" r="8.5" fill="#22110a"/>

            </svg>
          </div>

          <!-- Face 4 — bottom (rotateX 90) -->
          <div class="dice-face face-4">
            <svg viewBox="0 0 100 100" fill="none">
              <circle cx="30" cy="30" r="8.5" fill="#22110a"/>
              <circle cx="27" cy="26" r="3" fill="rgba(255,255,255,0.22)"/>
              <circle cx="70" cy="30" r="8.5" fill="#22110a"/>
              <circle cx="67" cy="26" r="3" fill="rgba(255,255,255,0.22)"/>

<script>
const COLORS = [
  { name: 'Blanc',       hex: '#f2f5ff' },
  { name: 'Crème',       hex: '#fdf6e3' },
  { name: 'Camel',       hex: '#d1a35e' },
  { name: 'Jaune',       hex: '#f5d000' },
  { name: 'Orange',      hex: '#ff5e00' },
  { name: 'Terracotta',  hex: '#b55353' },
  { name: 'Rose',        hex: '#f4a0b0' },
  { name: 'Framboise',   hex: '#c02858' },
  { name: 'Rouge',       hex: '#d42b2b' },
  { name: 'Bordeaux',    hex: '#7a1a30' },
  { name: 'Prune',       hex: '#6a2a4a' },
  { name: 'Violet',      hex: '#7b2d8b' },
  { name: 'Marron',      hex: '#6b3320' },
  { name: 'Bleu marine', hex: '#152844' },
  { name: 'Bleu',        hex: '#6ab4e8' },
  { name: 'Bleu glacé',  hex: '#cde8f5' },
  { name: 'Turquoise',   hex: '#00b5ad' },
  { name: 'Vert',        hex: '#6abf69' },
  { name: 'Vert olive',  hex: '#6b7229' },
  { name: 'Pistache',    hex: '#b5c96a' },
  { name: 'Gris',        hex: '#c0bdb8' },
  { name: 'Nuit',        hex: '#3c3052' },
  { name: 'Anthracite',  hex: '#383838' },
];

// ─── 3D Die State ─────────────────────────────────────────────────────────────

// Container rotation that makes each face face the viewer
// face-1: front (translateZ)  → show with rotateX(0) rotateY(0)
// face-2: right (rotateY 90)  → show with rotateY(-90)
// face-3: top  (rotateX -90)  → show with rotateX(90)
// face-4: bot  (rotateX  90)  → show with rotateX(-90)
// face-5: left (rotateY -90)  → show with rotateY(90)
// face-6: back (rotateY 180)  → show with rotateY(180)
const FACE_ROT = {
  1: { x:  0,   y:   0 },
  2: { x:  0,   y: -90 },
  3: { x: 90,   y:   0 },
  4: { x: -90,  y:   0 },
  5: { x:  0,   y:  90 },
  6: { x:  0,   y: 180 },
};

// Personality tilt — starts showing face 1 with classic 3-corner perspective
const TILT_X = -20;
const TILT_Y =  30;

// Cumulative CSS rotation (grows with each throw to avoid reset snap)
let cumX = TILT_X;
let cumY = TILT_Y;
let currentFace = 1;
let isRolling = false;

function pickN(arr, n) {
  return [...arr].sort(() => Math.random() - 0.5).slice(0, n);
}

async function roll() {
  if (isRolling) return;
  isRolling = true;

  const wrapper = document.getElementById('dice-wrapper');
  const cube    = document.getElementById('dice-cube');
  wrapper.classList.add('rolling');

  // Hide hint
  const hintEl = document.getElementById('dice-hint');
  hintEl.classList.add('hidden');

  // Pick result
  // Slightly weighted: 3 and 4 a touch more likely, 6 a touch less
  const N = (() => {
    const w = [16.5, 16.5, 18, 18, 16.5, 14.5];
    let r = Math.random() * 100;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i + 1; }
    return 6;
  })();

  // Compute target rotation: 2 full spins + delta to reach face N
  // (TILT cancels in dx/dy so formula simplifies cleanly)
  const dx = FACE_ROT[N].x - FACE_ROT[currentFace].x;
  const dy = FACE_ROT[N].y - FACE_ROT[currentFace].y;
  cumX += 720 + dx;
  cumY += 720 + dy;
  currentFace = N;

  cube.style.transform = `rotateX(${cumX}deg) rotateY(${cumY}deg)`;

  // Wait for CSS transition to settle (0.9s + small buffer)
  await new Promise(r => setTimeout(r, 1000));

  playWin();
  spawnSparkles(wrapper);

  // Short breathe before cards appear
  await new Promise(r => setTimeout(r, 100));

  // Build color cards
  const cardsArea = document.getElementById('cards-area');
  cardsArea.innerHTML = '';
  scaleCards(N);
  const pool = document.getElementById('noir-toggle-input').checked
    ? [...COLORS, { name: 'Noir', hex: '#111111' }]
    : COLORS;
  pickN(pool, N).forEach((color, i) => {
    const card = document.createElement('div');
    card.className = 'color-swatch';
    card.style.background = color.hex;
    card.style.transitionDelay = (i * 95) + 'ms';
    card.innerHTML = `<span class="swatch-name" style="color:${swatchTextColor(color.hex)}">${color.name}</span>`;
    cardsArea.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
  });

  wrapper.classList.remove('rolling');
  isRolling = false;
}

// ─── Swatch text color (auto light/dark) ─────────────────────────────────────
function swatchTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  if (lum > 0.52) {
    // Light bg: darken the color
    return `rgb(${Math.round(r*.32)},${Math.round(g*.32)},${Math.round(b*.32)})`;
  } else {
    // Dark bg: lighten the color
    return `rgb(${Math.round(r+(255-r)*.7)},${Math.round(g+(255-g)*.7)},${Math.round(b+(255-b)*.7)})`;
  }
}

// ─── Mobile card scaling ──────────────────────────────────────────────────────
function scaleCards(n) {
  if (window.innerWidth > 600) return;
  const r = document.documentElement;
  const t = (n - 1) / 5; // 0 at n=1 (big), 1 at n=6 (small)
  const lerp = (a, b) => Math.round(a + (b - a) * t);
  r.style.setProperty('--card-font',  (lerp(170, 95) / 100).toFixed(2) + 'rem');
  r.style.setProperty('--cards-gap',   lerp(8, 4)    + 'px');
}

// ─── Audio ────────────────────────────────────────────────────────────────────

function createAudioContext() {
  if (!window._audioCtx) window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return window._audioCtx;
}

function playWin() {
  try {
    const ctx = createAudioContext();
    [1046, 1318, 1567, 1760, 2093, 1318, 1760, 1046, 2093, 1567].forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.055 + Math.random() * 0.02;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.linearRampToValueAtTime(freq * 1.04, t + 0.08);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.start(t); osc.stop(t + 0.2);
    });
  } catch(e) {}
}

// ─── Sparkles ─────────────────────────────────────────────────────────────────

function spawnSparkles(el) {
  const colors = ['#e8a0bf','#a78bca','#f0c0d4','#f04400','#ffd700'];
  el.style.position = 'relative';
  el.style.overflow = 'visible';
  for (let i = 0; i < 8; i++) {
    const star = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    star.setAttribute('viewBox', '0 0 20 20');
    const c = colors[Math.floor(Math.random() * colors.length)];
    star.style.cssText = `
      position:absolute; width:${9+Math.random()*13}px; height:${9+Math.random()*13}px;
      left:${10+Math.random()*80}%; top:${5+Math.random()*70}%;
      pointer-events:none; z-index:10;
      animation:sparkle-pop 0.7s ease forwards;
      animation-delay:${i*0.055}s; opacity:0;`;
    star.innerHTML = `<path d="M10 1 L11.5 8 L18 10 L11.5 12 L10 19 L8.5 12 L2 10 L8.5 8 Z" fill="${c}"/>`;
    el.appendChild(star);
    setTimeout(() => star.remove(), 1100 + i * 60);
  }
}
